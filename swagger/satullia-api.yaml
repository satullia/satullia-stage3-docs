openapi: 3.0.3
info:
  title: Satullia API
  description: |
    Satullia backend REST API.

    This document describes every HTTP endpoint exposed by the Satullia micro-services
    (Auth, Profile, Access Control, Folder/Tab, Deck, Post, App-Version and File).

    Two public domains are used in the deployed (staging/prod) environment:

      * `https://api-satullia.danials.space`     – gateway + routed services (auth, profile, access-control, post, deck, app-version)
      * `https://file-satullia.danials.space`     – file service (upload/download)

    A gateway reverse-proxy (gorilla/mux in `gateway-service`) currently forwards:
      `/api/v1/profile*`        -> profile-service
      `/api/v1/auth*`           -> auth-service
      `/api/v1/access-control*` -> access-control-service
      `/api/v1/post*`           -> post-service
      `/api/v1/deck*`           -> deck-service
      `/api/v1/app-version*`    -> app-version-service

    The **folder/tab** endpoints of the folder-service are NOT routed through the gateway in
    the current deployment – call the service directly until the gateway is extended.

    ## Authentication
    Most endpoints require a JWT access token. Send it as:

      `Authorization: Bearer <access_token>`

    Obtain a token from `POST /api/v1/auth/login` (or `verify-code` / `refresh-token`).
    Access tokens are HS256 JWTs signed with the shared server secret and are valid for
    30 days; refresh tokens are valid for 90 days.

  version: 1.0.0
  contact:
    name: Satullia Backend Team
servers:
  - url: https://api-satullia.danials.space
    description: Deployed (staging / prod) gateway
  - url: https://file-satullia.danials.space
    description: Deployed file service
  - url: http://localhost:8080
    description: Local gateway
  - url: http://localhost:3006
    description: Local deck-service (direct)
security:
  - bearerAuth: []

tags:
  - name: Auth
    description: Registration, login, email verification and token refresh
  - name: Profile
    description: User profile read / update
  - name: Access Control
    description: User privilege levels (admin manage)
  - name: Folders
    description: Folder (deck of tabs) management, featured folders
  - name: Tabs
    description: Tab management, save/unsave, recent + saved lists
  - name: Deck
    description: Japanese-learning decks, flashcards and spaced-repetition progress
  - name: Post
    description: Blog / community posts
  - name: App Version
    description: App version announcements and force-update flags (admin manage)
  - name: File
    description: Image / file upload and download (MinIO backed)

paths:
  # ---------------------------------------------------------------------------
  # Auth service
  # ---------------------------------------------------------------------------
  /api/v1/auth/signup:
    post:
      tags: [Auth]
      summary: Register a new user
      description: Creates a user + profile, generates and e-mails a 6-digit verification code.
        Optional fields (fullname, username, bio, image_url) are nullable.
      operationId: signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
            example:
              email: user@example.com
              password: S3cureP@ssw0rd
              signup_method: APP
              fullname: John Doe
              username: johndoe
              bio: Hello world
              image_url: ""
      responses:
        '201':
          description: User registered successfully (verification e-mail sent)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: User successfully registered
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Log in and get JWT tokens
      description: Validates credentials, requires the account to be verified, returns an
        access token (30 days) and refresh token (90 days).
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: user@example.com
              password: S3cureP@ssw0rd
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
              example:
                access_token: eyJhbGciOiJIUzI1NiIs...
                refresh_token: eyJhbGciOiJIUzI1NiIs...
        '400':
          description: Missing fields or invalid email/password
          $ref: '#/components/responses/BadRequest'
        '401':
          description: User email not verified yet
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/verify-code:
    post:
      tags: [Auth]
      summary: Verify the e-mail verification code
      description: Marks the user verified and returns JWT tokens.
      operationId: verifyCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationRequest'
            example:
              email: user@example.com
              code: '123456'
      responses:
        '200':
          description: Verification succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          description: Invalid, expired or missing verification code
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/auth/resend-verify-code:
    post:
      tags: [Auth]
      summary: Resend the verification code e-mail
      operationId: resendVerifyCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendVerificationRequest'
            example:
              email: user@example.com
      responses:
        '200':
          description: Code resent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Verification code resent
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/auth/refresh-token:
    post:
      tags: [Auth]
      summary: Refresh the access token
      description: Returns a new access token using a valid refresh token.
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
            example:
              refresh_token: eyJhbGciOiJIUzI1NiIs...
      responses:
        '200':
          description: New access token
          content:
            application/json:
              schema:
                type: object
                required: [access_token]
                properties:
                  access_token:
                    type: string
              example:
                access_token: eyJhbGciOiJIUzI1NiIs...
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid refresh token
          $ref: '#/components/responses/Unauthorized'

  # ---------------------------------------------------------------------------
  # Profile service
  # ---------------------------------------------------------------------------
  /api/v1/profile:
    get:
      tags: [Profile]
      summary: Get a user profile
      description: Either look up a public profile by `?username=`, or (with a valid token
        and no username) return the authenticated user's own profile.
      operationId: getProfile
      parameters:
        - name: username
          in: query
          required: false
          description: Look up a public profile by username
          schema:
            type: string
            example: johndoe
      security: []
      responses:
        '200':
          description: Profile found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
              example:
                id: 1
                user_id: 1
                username: johndoe
                full_name: John Doe
                bio: Hello
                image_url: ""
                created_at: '2025-03-26T06:04:59.394518Z'
                updated_at: '2025-03-26T06:04:59.394518Z'
                privilege_level:
                  - ADMIN
        '400':
          description: Missing username and token
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/profile/update:
    post:
      tags: [Profile]
      summary: Update the authenticated user's profile
      description: All fields are optional. Only uses the value when it is provided (bio and
        image_url are nullable pointers).
      operationId: updateProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
            example:
              full_name: John Doe
              bio: Updated bio
              image_url: 826c7d5b-e231-4be1-8bc9-5db6e3ecec46
      responses:
        '200':
          description: Updated profile (model.Profile object)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------------------
  # Access control service
  # ---------------------------------------------------------------------------
  /api/v1/access-control/privileges:
    get:
      tags: [Access Control]
      summary: Get the authenticated user's privilege levels
      operationId: getMyPrivileges
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User privileges (empty array when no privileges)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserPrivilege'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Access Control]
      summary: Update a user's privilege levels (admin only)
      operationId: updatePrivileges
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrivilegesUpdateRequest'
            example:
              user_id: 2
              privilege_levels:
                - DEVELOPER
                - QA
      responses:
        '200':
          description: Privileges updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Privileges updated successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not an admin
          $ref: '#/components/responses/Forbidden'

  # ---------------------------------------------------------------------------
  # Folder service – folders
  # ---------------------------------------------------------------------------
  /api/v1/folders/all:
    get:
      tags: [Folders]
      summary: Get all folders (paginated)
      description: Query params `page` (default 1) and `pageSize` (default 10).
      operationId: getFolders
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, default: 10, maximum: 100 }
      responses:
        '200':
          description: Paginated folders
          content:
            application/json:
              schema:
                type: object
                required: [folders, pagination]
                properties:
                  folders:
                    type: array
                    items:
                      $ref: '#/components/schemas/Folder'
                  pagination:
                    $ref: '#/components/schemas/FolderPagination'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/folders/{id}:
    get:
      tags: [Folders]
      summary: Get a folder by ID
      operationId: getFolderById
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Folder
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Folder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Folders]
      summary: Delete a folder (owner only)
      operationId: deleteFolder
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/folders:
    post:
      tags: [Folders]
      summary: Create a folder
      description: Accepts a Folder body. `cover_image_id` defaults to
        `default_folder_cover.jpg`, `is_active` is forced to true and `tab_count` to 0.
      operationId: insertFolder
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Folder'
            example:
              title: My collection
              description: Tech links
              category: WORK
              cover_image_id: 826c7d5b-e231-4be1-8bc9-5db6e3ecec46
              tags: [go, backend]
              color: '#8BC34A'
      responses:
        '201':
          description: Folder created
          content:
            application/json:
              schema:
                type: object
                required: [message, folder]
                properties:
                  message:
                    type: string
                  folder:
                    $ref: '#/components/schemas/Folder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Folders]
      summary: Update a folder
      description: Body must include the folder `id`.
      operationId: updateFolder
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Folder'
            example:
              id: 1
              title: Updated title
              description: Updated
      responses:
        '200':
          description: Folder updated
          content:
            application/json:
              schema:
                type: object
                required: [message, folder]
                properties:
                  message:
                    type: string
                  folder:
                    $ref: '#/components/schemas/Folder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/folders/search:
    get:
      tags: [Folders]
      summary: Search folders by title / description
      operationId: searchFolders
      security:
        - bearerAuth: []
      parameters:
        - name: query
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Matching folders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Folder'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/folders/featured/all:
    get:
      tags: [Folders]
      summary: Get all featured folders (public)
      description: Uses the featured-folder repository in the folder-service. Note the
        deployed gateway currently returns 404 for this path (not routed yet).
      operationId: getFeaturedFolders
      security: []
      responses:
        '200':
          description: Featured folders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FeaturedFolder'

  /api/v1/folders/featured/{id}:
    get:
      tags: [Folders]
      summary: Check if a folder is featured (public)
      operationId: isFolderFeatured
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Featured status
          content:
            application/json:
              schema:
                type: object
                required: [is_featured]
                properties:
                  is_featured:
                    type: boolean
    post:
      tags: [Folders]
      summary: Add a folder to featured (auth)
      description: Optional `?order=` query param sets the display order.
      operationId: addFeaturedFolder
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: order
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: Added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Folders]
      summary: Remove a folder from featured (auth)
      operationId: removeFeaturedFolder
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  # ---------------------------------------------------------------------------
  # Folder service – tabs
  # ---------------------------------------------------------------------------
  /api/v1/tabs:
    get:
      tags: [Tabs]
      summary: Get all tabs (paginated)
      description: Query params `page` (default 1) and `pageSize` (default 10). Every tab
        carries an `is_saved` flag (computed when a token is supplied).
      operationId: getAllTabs
      security: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, default: 10 }
      responses:
        '200':
          description: Paginated tabs
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TabWithStatus'
                  pagination:
                    $ref: '#/components/schemas/TabPagination'
    post:
      tags: [Tabs]
      summary: Create a tab
      description: Requires `url` and `title`. May include notes and file attachments.
      operationId: insertTab
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InsertTabRequest'
            example:
              title: OpenCode
              description: CLI
              url: https://opencode.ai
              folder_id: 1
              tags: [cli, ai]
              notes:
                - content: first note
              files:
                - uploaded_file_id: 826c7d5b-e231-4be1-8bc9-5db6e3ecec46
      responses:
        '201':
          description: Tab created (complete tab incl. notes/files)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tab'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Tabs]
      summary: Update a tab
      description: The tab ID is read from the `?id=` query parameter (not the body).
        Notes and files passed with an `id` are updated, others are created.
      operationId: editTab
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: query
          required: true
          description: Tab ID to edit
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InsertTabRequest'
            example:
              title: Updated title
              url: https://opencode.ai
      responses:
        '200':
          description: Tab updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tab'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/tabs/{id}:
    get:
      tags: [Tabs]
      summary: Get a tab by ID
      description: Includes `is_saved`. When authenticated, the tab is recorded as recently
        viewed.
      operationId: getTabById
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Tab with status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TabWithStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Tabs]
      summary: Delete a tab
      operationId: deleteTab
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/tabs/folder/{folder_id}:
    get:
      tags: [Tabs]
      summary: Get all tabs inside a folder
      operationId: tabsInFolder
      security: []
      parameters:
        - name: folder_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Tabs (each with is_saved)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TabWithStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/tabs/search:
    get:
      tags: [Tabs]
      summary: Search tabs
      description: Query param is `q` (search query), optional `page` and `pageSize`.
      operationId: searchTabs
      security: []
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 10 }
      responses:
        '200':
          description: Matching tabs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TabWithStatus'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/tabs/{id}/save:
    post:
      tags: [Tabs]
      summary: Save a tab for the authenticated user
      operationId: saveTab
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                type: object
                required: [success, message, tab]
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  tab:
                    $ref: '#/components/schemas/Tab'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/tabs/{id}/unsave:
    delete:
      tags: [Tabs]
      summary: Unsave a tab
      operationId: unsaveTab
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Un-saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  tab:
                    $ref: '#/components/schemas/Tab'

  /api/v1/tabs/saved:
    get:
      tags: [Tabs]
      summary: Get the authenticated user's saved tabs
      operationId: getUserSavedTabs
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Saved tabs
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    tab_id: { type: integer }
                    tab:
                      $ref: '#/components/schemas/Tab'
                    is_saved: { type: boolean, example: true }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/tabs/recent:
    get:
      tags: [Tabs]
      summary: Get the authenticated user's recently viewed tabs
      operationId: getUserRecentTabs
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Recent tabs
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    tab_id: { type: integer }
                    tab:
                      $ref: '#/components/schemas/Tab'
                    is_saved: { type: boolean }
                    last_viewed_at: { type: string, format: date-time }

  # ---------------------------------------------------------------------------
  # Deck service
  # ---------------------------------------------------------------------------
  /api/v1/deck:
    post:
      tags: [Deck]
