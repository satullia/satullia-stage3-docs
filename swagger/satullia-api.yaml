  # ---------------------------------------------------------------------------
  # File service
  # ---------------------------------------------------------------------------
  /api/v1/file/upload:
    post:
      tags: [File]
      summary: Upload an image
      description: |
        Multipart/form-data upload with a field named `file`. The service decodes the image,
        stores the original and generates `_preview` (1000px), `_thumbnail` (400px) and
        `_icon` (100px) JPEG variants in MinIO (`satullia` bucket). The base filename is a
        generated UUID used to build subsequent variant filenames, e.g.
        `826c7d5b-..._thumbnail`.
      operationId: uploadFile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Uploaded file record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadedFile'
        '400':
          description: Missing file or invalid image
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/file/download/{filename}:
    get:
      tags: [File]
      summary: Download a file / image variant
      description: Streams the stored object. Content-Type and Content-Length are set from
        MinIO metadata. Public – no authentication required.
      operationId: downloadFile
      security: []
      parameters:
        - name: filename
          in: path
          required: true
          description: e.g. `826c7d5b-e231-4be1-8bc9-5db6e3ecec46` or
            `826c7d5b-e231-4be1-8bc9-5db6e3ecec46_thumbnail`
          schema: { type: string }
      responses:
        '200':
          description: File stream
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: File not found
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

