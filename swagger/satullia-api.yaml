components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: HS256 JWT access token from POST /api/v1/auth/login.
  responses:
    BadRequest:
      description: Bad request – missing or invalid payload/params
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: BAD_REQUEST
              message: Missing or invalid parameters
    Unauthorized:
      description: Missing, invalid or expired access token / not verified
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated but not allowed to perform this action
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found (or route not implemented)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    # ---------- auth ----------
    SignupRequest:
      type: object
      required: [email, password, signup_method]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
        signup_method:
          $ref: '#/components/schemas/SignupMethod'
        fullname:
          type: string
        username:
          type: string
        bio:
          type: string
        image_url:
          type: string
    SignupMethod:
      type: string
      enum: [APP, GOOGLE, APPLE, WHATSAPP]
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    VerificationRequest:
      type: object
      required: [email, code]
      properties:
        email: { type: string, format: email }
        code: { type: string, example: '123456' }
    ResendVerificationRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    TokenPair:
      type: object
      required: [access_token, refresh_token]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
    MessageResponse:
      type: object
      required: [message]
      properties:
        message: { type: string }
    ErrorResponse:
      type: object
      properties:
        error:
          oneOf:
            - type: object
              required: [code, message]
              properties:
                code: { type: string }
                message: { type: string }
            - type: string
              description: Simpler error string used by some handlers (field is a JSON string)

    # ---------- profile ----------
    Profile:
      type: object
      properties:
        id: { type: integer }
        user_id: { type: integer }
        username: { type: string }
        full_name: { type: string }
        bio: { type: string }
        image_url: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        privilege_level:
          type: array
          items:
            $ref: '#/components/schemas/PrivilegeLevel'
    UpdateProfileRequest:
      type: object
      properties:
        full_name: { type: string }
        bio: { type: string }
        image_url: { type: string }

    # ---------- access control ----------
    PrivilegeLevel:
      type: string
      enum: [ADMIN, SUPPORT, QA, DEMO, DEVELOPER]
    UserPrivilege:
      type: object
      properties:
        id: { type: integer }
        user_id: { type: integer }
        privilege_level:
          type: array
          items:
            $ref: '#/components/schemas/PrivilegeLevel'
        given_by: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deleted_at: { type: string, format: date-time }
    PrivilegesUpdateRequest:
      type: object
      required: [user_id, privilege_levels]
      properties:
        user_id: { type: integer }
        privilege_levels:
          type: array
          items:
            $ref: '#/components/schemas/PrivilegeLevel'

    # ---------- folders ----------
    Folder:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        category:
          type: string
          enum: [WORK, PERSONAL, EDUCATION, OTHER]
        level: { type: string }
        image_ids:
          type: array
          items: { type: string }
        cover_image_id: { type: string }
        is_active: { type: boolean }
        inserted_by: { type: integer }
        tab_count: { type: integer }
        difficulty: { type: integer }
        tags:
          type: array
          items: { type: string }
        color: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    FolderPagination:
      type: object
      properties:
        total_count: { type: integer }
        total_pages: { type: integer }
        current_page: { type: integer }
        page_size: { type: integer }
        has_next_page: { type: boolean }
        has_previous_page: { type: boolean }
    FeaturedFolder:
      type: object
      description: Featured folder row (featured_folders table)
      properties:
        id: { type: integer }
        folder_id: { type: integer }
        display_order: { type: integer }
        added_at: { type: string, format: date-time }
        folder:
          $ref: '#/components/schemas/Folder'

    # ---------- tabs ----------
    InsertTabRequest:
      type: object
      required: [title, url]
      properties:
        title: { type: string }
        description: { type: string }
        url: { type: string, format: uri }
        folder_id: { type: integer }
        tags:
          type: array
          items: { type: string }
        notes:
          type: array
          items:
            $ref: '#/components/schemas/TabNote'
        files:
          type: array
          items:
            $ref: '#/components/schemas/TabFile'
        deleted_at: { type: string, format: date-time }
    Tab:
      type: object
      properties:
        id: { type: integer }
        folder_id: { type: integer }
        url: { type: string }
        title: { type: string }
        description: { type: string }
        tags:
          type: array
          items: { type: string }
        inserted_by: { type: integer }
        deleted_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        notes:
          type: array
          items:
            $ref: '#/components/schemas/TabNote'
        files:
          type: array
          items:
            $ref: '#/components/schemas/TabFile'
    TabWithStatus:
      allOf:
        - $ref: '#/components/schemas/Tab'
        - type: object
          properties:
            is_saved: { type: boolean }
    TabNote:
      type: object
      properties:
        id: { type: integer }
        tab_id: { type: integer }
        content: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TabFile:
      type: object
      properties:
        id: { type: integer }
        tab_id: { type: integer }
        uploaded_file_id: { type: string }
        created_at: { type: string, format: date-time }
        uploaded_at: { type: string, format: date-time }
    TabPagination:
      type: object
      properties:
        total_count: { type: integer }
        total_pages: { type: integer }
        current_page: { type: integer }
        page_size: { type: integer }
        has_next_page: { type: boolean }
        has_previous_page: { type: boolean }

    # ---------- deck ----------
    Deck:
      type: object
      description: A flashcard deck. Response decks may also include `is_saved`.
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        category: { type: string, default: VOCABULARY }
        level: { type: string, default: N5 }
        image_ids:
          type: array
          items: { type: string }
        cover_image_id: { type: string }
        is_active: { type: boolean }
        inserted_by: { type: integer }
        card_count: { type: integer }
        difficulty: { type: integer, default: 1 }
        tags:
          type: array
          items: { type: string }
        color: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        is_saved: { type: boolean }
    DeckPaginated:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Deck'
        pagination:
          type: object
          properties:
            limit: { type: integer }
            offset: { type: integer }
            total: { type: integer }
    FeaturedDeckList:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        data:
          type: array
          items:
            $ref: '#/components/schemas/FeaturedDeck'
    FeaturedDeck:
      type: object
      properties:
        id: { type: integer }
        deck_id: { type: integer }
        display_order: { type: integer }
        added_at: { type: string, format: date-time }
        deck:
          $ref: '#/components/schemas/Deck'
    Flashcard:
      type: object
      properties:
        id: { type: integer }
        deck_id: { type: integer }
        japanese: { type: string }
        furigana: { type: string }
        romaji: { type: string }
        meaning: { type: string }
        example: { type: string }
        example_meaning: { type: string }
        type: { type: string, default: VOCABULARY }
        level: { type: string, default: N5 }
        writing_system: { type: string, default: KANJI }
        audio_url: { type: string }
        image_url: { type: string }
        tags:
          type: array
          items: { type: string }
        notes: { type: string }
        inserted_by: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ProgressRecord:
      type: object
      description: A single flashcard review record (learning_progress table)
      properties:
        id: { type: integer }
        user_id: { type: integer }
        flashcard_id: { type: integer }
        proficiency: { type: integer, default: 0 }
        review_count: { type: integer, default: 0 }
        correct_count: { type: integer, default: 0 }
        is_correct: { type: boolean }
        last_reviewed_at: { type: string, format: date-time }
        next_review_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    DeckProgress:
      type: object
      description: Aggregate progress in a deck (deck_progress table)
      properties:
        id: { type: integer }
        user_id: { type: integer }
        deck_id: { type: integer }
        cards_completed: { type: integer, default: 0 }
        total_cards: { type: integer, default: 0 }
        average_proficiency: { type: number, format: float, default: 0 }
        last_accessed_at: { type: string, format: date-time }

    # ---------- post ----------
    Post:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        content: { type: string }
        description: { type: string }
        author: { type: string }
        author_id: { type: integer }
        image_url: { type: string }
        image_ids:
          type: array
          items: { type: string }
        cover_image_id: { type: string }
        published_at: { type: string, format: date-time }
        is_featured: { type: boolean }
        category_id: { type: integer }
        category_name: { type: string }
        tags:
          type: array
          items: { type: string }
        view_count: { type: integer }
        approval_status:
          type: string
          enum: [PENDING, APPROVED, REJECTED]
        approved_by: { type: integer }
        inserted_by: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deleted_at: { type: string, format: date-time }
        publication_status:
          type: string
          enum: [DRAFT, PUBLISHED]
        visibility_scope: { type: string }
        deck_ids:
          type: array
          items: { type: integer }

    # ---------- app version ----------
    AppVersion:
      type: object
      properties:
        id: { type: integer }
        is_current: { type: boolean }
        is_force: { type: boolean }
        title: { type: string }
        description: { type: string }
        version: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AppVersionRequest:
      type: object
      required: [title, version]
      properties:
        title: { type: string }
        description: { type: string }
        version: { type: string }
        is_current: { type: boolean }
        is_force: { type: boolean }

    # ---------- file ----------
    UploadedFile:
      type: object
      properties:
        id: { type: integer }
        name: { type: string, description: Base filename (UUID) stored in DB }
        user_id: { type: integer }
        created_at: { type: string, format: date-time }
        deleted_at: { type: string, format: date-time }